description: Print the SHA-256 digest of a named file.

inputs:
  path:
    type: string
    required: true

steps:
  - name: File SHA-256
    shell: |
      set -eu
      path={{shellQuote(path)}}
      if command -v sha256sum >/dev/null 2>&1; then
        sha256sum < "$path"
      else
        shasum -a 256 < "$path"
      fi
